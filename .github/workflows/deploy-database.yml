# Applies the database migrations and the sign-in settings to the hosted Supabase project (EU).
# Runs on GitHub's machines, which can reach Supabase. Needs these repository secrets
# (GitHub → Settings → Secrets and variables → Actions); without them it stops with a notice:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   the project's reference id (Project Settings → General)
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#   APP_URL                the app's public address, e.g. https://my-app.vercel.app
# Optional, to send emails through our own mail server (e.g. Resend):
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_SENDER_EMAIL, SMTP_SENDER_NAME
# Demo data (supabase/seed.sql) is never sent.
name: Database (Supabase)

on:
  push:
    branches: [claude/amazing-davinci-5th459]
    paths:
      - "supabase/**"
      - "scripts/supabase-production-config.mjs"
      - ".github/workflows/deploy-database.yml"
  workflow_dispatch:
  # Called by the launch workflow (release.yml), with the commit of the version being launched.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets are given only to the steps that use them (never to the third-party setup action).
    steps:
      - name: Check the settings
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase is not connected yet: add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD to the repository secrets (see docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$APP_URL" ]; then echo "app_url=true" >> "$GITHUB_OUTPUT"; fi

      # Once versions are launched from our console (a "production" branch exists), the database is
      # updated by each launch, not by every push to the development branch.
      - name: Launches in use?
        if: steps.check.outputs.ready == 'true' && github.event_name == 'push'
        id: launches
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'production' }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/$RELEASE_BRANCH" --silent 2>/dev/null; then
            echo "::notice::Versions are launched from the console: the database is updated by the launch (Platform → Versions)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true' && steps.launches.outputs.skip != 'true'
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true' && steps.launches.outputs.skip != 'true'
        with:
          version: 2.121.0

      # The CLI reads SUPABASE_DB_PASSWORD from the environment: it never appears on a command line.
      - name: Connect to the project
        if: steps.check.outputs.ready == 'true' && steps.launches.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply the migrations
        if: steps.check.outputs.ready == 'true' && steps.launches.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Apply the sign-in settings (addresses, email templates, mail server)
        if: steps.check.outputs.ready == 'true' && steps.launches.outputs.skip != 'true' && steps.check.outputs.app_url == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          APP_URL: ${{ secrets.APP_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
        run: |
          node scripts/supabase-production-config.mjs
          supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Sign-in settings skipped
        if: steps.check.outputs.ready == 'true' && steps.launches.outputs.skip != 'true' && steps.check.outputs.app_url != 'true'
        run: |
          echo "::notice::APP_URL is missing: sign-in links and email templates were not configured (see docs/DEPLOY.md)."
