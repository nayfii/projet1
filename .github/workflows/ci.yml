# Checks on every push and pull request (V1.1 phases 11–12; docs/COMPLIANCE.md §15): types, lint, unit
# tests (including: every setting documented, V1.1 migrations destroy no data, logs carry no content)
# and the production dependencies' known vulnerabilities (fails on high or critical). The integration
# and end-to-end suites need the local database stack and run before each release (docs/STATUS.md).
name: Checks

on:
  push:
    branches-ignore: [production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The render worker has its own dependencies; only their types are needed here (no browser download).
      - name: Install the render worker's dependencies (types)
        run: npm ci --prefix worker --no-audit --no-fund --ignore-scripts
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: FFmpeg (the video unit tests build real MP4s)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        run: pnpm test
      - name: Dependencies (high and critical)
        run: pnpm audit --prod --audit-level high
