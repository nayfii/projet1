# Checks the live version as a demo boss and a demo employee of our fictional company ("Démo —
# vérification"): signs in, opens each screen, records errors and captures, and stores the result for
# our console (Platform → Aperçu). Started by the console ("Vérifier maintenant") and after each launch.
# Needs the secrets APP_URL, SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF (already used to deploy the
# database). The project's secret key is read from Supabase at run time and masked in the logs.
name: Check the live version
run-name: Check ${{ inputs.expect_version || 'the live version' }}

on:
  workflow_dispatch:
    inputs:
      expect_version:
        description: Wait until the site runs this version (e.g. v1.4), then check it
        required: false
        default: ""
  workflow_call:
    inputs:
      expect_version:
        type: string
        required: false
        default: ""

concurrency:
  group: verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the settings
        id: check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::The check needs APP_URL, SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in the repository secrets (docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Wait for the new version to be live
        if: steps.check.outputs.ready == 'true' && inputs.expect_version != ''
        env:
          APP_URL: ${{ secrets.APP_URL }}
          EXPECT: ${{ inputs.expect_version }}
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS "$APP_URL/api/version" | jq -r .version || true)
            if [ "$live" = "$EXPECT" ]; then echo "Live: $live"; exit 0; fi
            sleep 15
          done
          echo "::warning::The site still runs ${live:-an unknown version} after 15 minutes; checking it anyway."

      - name: Check as the demo boss and the demo employee
        if: steps.check.outputs.ready == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          keys=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true")
          key=$(jq -r '([.[] | select(.type == "secret" and .api_key != null)][0].api_key) // ([.[] | select(.name == "service_role")][0].api_key) // empty' <<< "$keys")
          if [ -z "$key" ]; then echo "::error::No secret key found for the Supabase project."; exit 1; fi
          echo "::add-mask::$key"
          SUPABASE_SERVICE_KEY="$key" SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co" node scripts/verify/check.mjs
