# Builds the render worker's Docker image (Chromium, FFmpeg, HyperFrames) to check that it still builds.
# It is not published anywhere: hosting the worker is a decision still open (docs/STATUS.md).
name: Render worker image

on:
  push:
    branches: [claude/amazing-davinci-5th459]
    paths:
      - "worker/**"
      - "src/modules/render/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f worker/Dockerfile -t render-worker .
      - name: Check the tools inside
        run: |
          docker run --rm --entrypoint sh render-worker -c 'ffmpeg -version | head -1 && node --version && ls dist/index.js "$CAPTION_FONT_FILE" && ls /opt/puppeteer'
